# 键为英文源文，缺失时运行期回退英文。
"React skin settings": "Cài đặt giao diện React"
"React skin specific settings, such as form style, stored in the parameter dictionary": "Cài đặt riêng của giao diện React, chẳng hạn như kiểu biểu mẫu, được lưu trong từ điển tham số của cơ sở dữ liệu"
"Form style. inline - three columns in one row (MVC style); vertical - label on one line and control on the next (antd style)": "Kiểu biểu mẫu. inline - ba cột trên một hàng (kiểu MVC); vertical - nhãn trên một hàng và điều khiển ở hàng tiếp theo (kiểu antd)"
"Field description display. 1 - small text after the label; 2 - question mark tooltip after the label; 0 - hidden": "Hiển thị mô tả trường. 1 - văn bản nhỏ sau nhãn; 2 - chú giải dấu hỏi sau nhãn; 0 - ẩn"
"Text box clear icon. true - show a clear icon when the input is focused and not empty; false - never show": "Biểu tượng xóa ô văn bản. true - hiển thị biểu tượng khi trường được chọn và không trống; false - không bao giờ hiển thị"
"Region picker. cascader - cascading dropdown (default); tabs - MVC-style tabbed popup with provinces grouped by region": "Bộ chọn khu vực. cascader - danh sách thả xuống theo tầng (mặc định); tabs - cửa sổ bật lên dạng tab kiểu MVC, các tỉnh được nhóm theo khu vực"
