# 键为英文源文，缺失时运行期回退英文。
"React skin settings": "Setările temei React"
"React skin specific settings, such as form style, stored in the parameter dictionary": "Setări specifice temei React, cum ar fi stilul formularului, salvate în dicționarul de parametri al bazei de date"
"Form style. inline - three columns in one row (MVC style); vertical - label on one line and control on the next (antd style)": "Stilul formularului. inline - trei coloane pe un rând (stil MVC); vertical - etichetă pe un rând și controlul pe rândul următor (stil antd)"
"Field description display. 1 - small text after the label; 2 - question mark tooltip after the label; 0 - hidden": "Afișarea descrierii câmpului. 1 - text mic după etichetă; 2 - balon cu semn de întrebare după etichetă; 0 - ascuns"
"Text box clear icon. true - show a clear icon when the input is focused and not empty; false - never show": "Pictograma de ștergere a casetei de text. true - afișează pictograma când câmpul este focusat și nu este gol; false - niciodată"
"Region picker. cascader - cascading dropdown (default); tabs - MVC-style tabbed popup with provinces grouped by region": "Selector de regiune. cascader - listă derulantă în cascadă (implicit); tabs - fereastră pop-up cu file în stil MVC, provincii grupate pe regiuni"
