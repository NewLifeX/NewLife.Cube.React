name: test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: NewLife.Cube.React/web/pnpm-lock.yaml

    - name: Install web dependencies
      working-directory: NewLife.Cube.React/web
      run: pnpm install --frozen-lockfile

    - name: Type check
      working-directory: NewLife.Cube.React/web
      run: pnpm type-check

    - name: Unit test
      working-directory: NewLife.Cube.React/web
      run: pnpm test:unit

    # 产出 ../wwwroot，供下一步 .NET 构建嵌入到皮肤包
    - name: Build web
      working-directory: NewLife.Cube.React/web
      run: pnpm build

    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          9.x
          10.x

    - name: Build .NET solution
      run: dotnet build 魔方React.slnx -c Release
