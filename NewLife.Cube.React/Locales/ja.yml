# 键为英文源文，缺失时运行期回退英文。
"React skin settings": "React スキン設定"
"React skin specific settings, such as form style, stored in the parameter dictionary": "React スキン固有の設定（フォームスタイルなど）。データベースのパラメータ辞書に保存されます。"
"Form style. inline - three columns in one row (MVC style); vertical - label on one line and control on the next (antd style)": "フォームスタイル。inline - 1 行に 3 列（MVC スタイル）、vertical - ラベルを 1 行、コントロールを次の行（antd スタイル）"
"Field description display. 1 - small text after the label; 2 - question mark tooltip after the label; 0 - hidden": "フィールド説明の表示。1 - ラベルの後に小さなテキスト、2 - ラベルの後に疑問符のツールチップ、0 - 非表示"
"Text box clear icon. true - show a clear icon when the input is focused and not empty; false - never show": "テキストボックスのクリアアイコン。true - フォーカス時かつ入力がある場合にクリアアイコンを表示、false - 常に非表示"
"Region picker. cascader - cascading dropdown (default); tabs - MVC-style tabbed popup with provinces grouped by region": "地域選択。cascader - 階層ドロップダウン（既定）、tabs - MVC スタイルのタブポップアップ（省を地域別にグループ化）"
