# 键为英文源文，缺失时运行期回退英文。
"React skin settings": "Ρυθμίσεις θέματος React"
"React skin specific settings, such as form style, stored in the parameter dictionary": "Ειδικές ρυθμίσεις του θέματος React, όπως στυλ φόρμας, αποθηκευμένες στο λεξικό παραμέτρων της βάσης δεδομένων"
"Form style. inline - three columns in one row (MVC style); vertical - label on one line and control on the next (antd style)": "Στυλ φόρμας. inline - τρεις στήλες σε μία σειρά (στυλ MVC); vertical - ετικέτα σε μία σειρά και στοιχείο ελέγχου στην επόμενη (στυλ antd)"
"Field description display. 1 - small text after the label; 2 - question mark tooltip after the label; 0 - hidden": "Εμφάνιση περιγραφής πεδίου. 1 - μικρό κείμενο μετά την ετικέτα; 2 - συμβουλή με ερωτηματικό μετά την ετικέτα; 0 - κρυφό"
"Text box clear icon. true - show a clear icon when the input is focused and not empty; false - never show": "Εικονίδιο εκκαθάρισης πλαισίου κειμένου. true - εμφάνιση εικονιδίου όταν το πεδίο έχει εστίαση και δεν είναι κενό; false - ποτέ"
"Region picker. cascader - cascading dropdown (default); tabs - MVC-style tabbed popup with provinces grouped by region": "Επιλογέας περιοχής. cascader - διαδοχικό αναπτυσσόμενο μενού (προεπιλογή); tabs - αναδυόμενο παράθυρο καρτελών σε στυλ MVC με επαρχίες ομαδοποιημένες ανά περιοχή"
