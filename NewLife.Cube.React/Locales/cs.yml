# 键为英文源文，缺失时运行期回退英文。
"React skin settings": "Nastavení motivu React"
"React skin specific settings, such as form style, stored in the parameter dictionary": "Nastavení specifické pro motiv React, například styl formuláře, uložené ve slovníku parametrů databáze"
"Form style. inline - three columns in one row (MVC style); vertical - label on one line and control on the next (antd style)": "Styl formuláře. inline - tři sloupce v jednom řádku (styl MVC); vertical - popisek na jednom řádku a ovládací prvek na dalším (styl antd)"
"Field description display. 1 - small text after the label; 2 - question mark tooltip after the label; 0 - hidden": "Zobrazení popisu pole. 1 - malý text za popiskem; 2 - bublina s otazníkem za popiskem; 0 - skryto"
"Text box clear icon. true - show a clear icon when the input is focused and not empty; false - never show": "Ikona vymazání textového pole. true - zobrazit ikonu vymazání při zaměření a neprázdném vstupu; false - nikdy nezobrazovat"
"Region picker. cascader - cascading dropdown (default); tabs - MVC-style tabbed popup with provinces grouped by region": "Výběr oblasti. cascader - kaskádový rozbalovací seznam (výchozí); tabs - vyskakovací okno se záložkami ve stylu MVC, provincie seskupené podle oblasti"
