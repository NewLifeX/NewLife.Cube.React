"React skin specific settings, such as form style, stored in the parameter dictionary": "Configurações específicas do tema React, como o estilo do formulário, armazenadas no dicionário de parâmetros do banco de dados"
"Form style. inline - three columns in one row (MVC style); vertical - label on one line and control on the next (antd style)": "Estilo do formulário. inline - três colunas em uma linha (estilo MVC); vertical - rótulo em uma linha e controle na seguinte (estilo antd)"
"Field description display. 1 - small text after the label; 2 - question mark tooltip after the label; 0 - hidden": "Exibição da descrição do campo. 1 - texto pequeno após o rótulo; 2 - dica com ponto de interrogação após o rótulo; 0 - oculto"
"Text box clear icon. true - show a clear icon when the input is focused and not empty; false - never show": "Ícone de limpeza da caixa de texto. true - mostrar o ícone quando o campo estiver em foco e não vazio; false - nunca mostrar"
