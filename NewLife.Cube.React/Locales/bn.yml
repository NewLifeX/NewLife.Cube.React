# 键为英文源文，缺失时运行期回退英文。
"React skin settings": "React স্কিন সেটিংস"
"React skin specific settings, such as form style, stored in the parameter dictionary": "React স্কিনের নিজস্ব সেটিংস, যেমন ফর্ম স্টাইল, যা ডাটাবেস প্যারামিটার অভিধানে সংরক্ষিত হয়"
"Form style. inline - three columns in one row (MVC style); vertical - label on one line and control on the next (antd style)": "ফর্ম স্টাইল। inline - এক সারিতে তিনটি কলাম (MVC স্টাইল); vertical - লেবেল এক সারিতে, কন্ট্রোল পরের সারিতে (antd স্টাইল)"
"Field description display. 1 - small text after the label; 2 - question mark tooltip after the label; 0 - hidden": "ফিল্ড বর্ণনা প্রদর্শন। 1 - লেবেলের পরে ছোট লেখা; 2 - লেবেলের পরে প্রশ্নচিহ্ন টুলটিপ; 0 - লুকানো"
"Text box clear icon. true - show a clear icon when the input is focused and not empty; false - never show": "টেক্সট বক্স ক্লিয়ার আইকন। true - ইনপুট ফোকাসে ও খালি না হলে ক্লিয়ার আইকন দেখান; false - কখনও দেখাবেন না"
"Region picker. cascader - cascading dropdown (default); tabs - MVC-style tabbed popup with provinces grouped by region": "অঞ্চল নির্বাচক। cascader - ধারাবাহিক ড্রপডাউন (ডিফল্ট); tabs - MVC স্টাইলের ট্যাব পপআপ, অঞ্চল অনুযায়ী প্রদেশ গোষ্ঠীবদ্ধ"
"Form": "ফর্ম"
"Three columns in one row (MVC style)": "এক সারিতে তিনটি কলাম (MVC স্টাইল)"
"Label on one line, control on the next (antd style)": "লেবেল এক সারিতে, কন্ট্রোল পরের সারিতে (antd স্টাইল)"
"Small text after the label": "লেবেলের পরে ছোট লেখা"
"Question mark tooltip": "প্রশ্নচিহ্ন টুলটিপ"
