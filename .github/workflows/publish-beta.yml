name: publish-beta

on:
  push:
    branches: [ master ]
    paths:
        - 'NewLife.Cube.React/**'
        - '!NewLife.Cube.React/web/e2e/**'
  pull_request:
    branches: [ master ]
    paths:
        - 'NewLife.Cube.React/**'
  workflow_dispatch:

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 皮肤包需内含 wwwroot（前端产物）；web 的 @newlifex/* 以 file: 引用共享包源码，
    # 故把 monorepo 检出到该相对位置后再构建前端。
    - name: Checkout shared packages monorepo
      uses: actions/checkout@v4
      with:
        repository: NewLifeX/NewLife.Cube
        path: _deps/NewLife.Cube

    - name: Link monorepo into path expected by web dependencies
      run: ln -s "$GITHUB_WORKSPACE/_deps/NewLife.Cube" "$GITHUB_WORKSPACE/../NewLife.Cube"

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: |
          NewLife.Cube.React/web/pnpm-lock.yaml
          _deps/NewLife.Cube/pnpm-lock.yaml

    - name: Build shared packages
      run: |
        cd _deps/NewLife.Cube
        pnpm install --frozen-lockfile
        pnpm build

    - name: Build web (wwwroot)
      working-directory: NewLife.Cube.React/web
      run: |
        pnpm install --frozen-lockfile
        pnpm build

    - name: Setup dotNET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.x
          9.x
          10.x

    - name: Get Version
      run: echo "VERSION=$(date '+%Y.%m%d-beta%H%M')" >> $GITHUB_ENV

    - name: Build
      run: dotnet build 魔方React.slnx -c Release --version-suffix ${{ env.VERSION }}

    - name: Pack
      run: dotnet pack --no-build --version-suffix ${{ env.VERSION }} -c Release -o out NewLife.Cube.React/NewLife.Cube.React.csproj

    - name: Publish
      run: |
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://nuget.pkg.github.com/NewLifeX/index.json --api-key ${{ github.token }}
        dotnet nuget push ./out/*.nupkg --skip-duplicate --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.nugetKey }}
