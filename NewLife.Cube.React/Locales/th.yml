# 键为英文源文，缺失时运行期回退英文。
"React skin settings": "การตั้งค่าธีม React"
"React skin specific settings, such as form style, stored in the parameter dictionary": "การตั้งค่าเฉพาะของธีม React เช่น รูปแบบฟอร์ม จัดเก็บในพจนานุกรมพารามิเตอร์ของฐานข้อมูล"
"Form style. inline - three columns in one row (MVC style); vertical - label on one line and control on the next (antd style)": "รูปแบบฟอร์ม. inline - สามคอลัมน์ในหนึ่งแถว (สไตล์ MVC); vertical - ป้ายกำกับหนึ่งแถวและตัวควบคุมแถวถัดไป (สไตล์ antd)"
"Field description display. 1 - small text after the label; 2 - question mark tooltip after the label; 0 - hidden": "การแสดงคำอธิบายฟิลด์. 1 - ข้อความเล็กหลังป้ายกำกับ; 2 - คำแนะนำเครื่องหมายคำถามหลังป้ายกำกับ; 0 - ซ่อน"
"Text box clear icon. true - show a clear icon when the input is focused and not empty; false - never show": "ไอคอนล้างกล่องข้อความ. true - แสดงไอคอนล้างเมื่อโฟกัสและไม่ว่าง; false - ไม่แสดงเลย"
"Region picker. cascader - cascading dropdown (default); tabs - MVC-style tabbed popup with provinces grouped by region": "ตัวเลือกภูมิภาค. cascader - รายการแบบเลื่อนลงแบบเรียงซ้อน (ค่าเริ่มต้น); tabs - ป๊อปอัปแท็บสไตล์ MVC โดยจัดกลุ่มจังหวัดตามภูมิภาค"
"Form": "ฟอร์ม"
"Three columns in one row (MVC style)": "สามคอลัมน์ในหนึ่งแถว (สไตล์ MVC)"
"Label on one line, control on the next (antd style)": "ป้ายกำกับหนึ่งแถว ตัวควบคุมแถวถัดไป (สไตล์ antd)"
"Small text after the label": "ข้อความเล็กหลังป้ายกำกับ"
"Question mark tooltip": "คำแนะนำเครื่องหมายคำถาม"
"Hidden": "ซ่อน"
"Cascading dropdown": "รายการแบบเลื่อนลงแบบเรียงซ้อน"
"Tabbed popup (MVC style, grouped by region)": "ป๊อปอัปแท็บ (สไตล์ MVC จัดกลุ่มตามภูมิภาค)"
"React front-end skin": "ธีมส่วนหน้าของ React"
